<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE0AD"/>
      <stop offset="50%" stop-color="#DFAC6C"/>
      <stop offset="100%" stop-color="#C28841"/>
    </linearGradient>
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3E5D8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Crown / Halo Emblem -->
  <g transform="translate(10, 10)">
    <!-- Outer Glow Ring / Crescent -->
    <path d="M 30,5 C 16,5 5,16 5,30 C 5,44 16,55 30,55 C 44,55 55,44 55,30" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 3"/>
    
    <!-- Stylized Cake Stand & Cloche Silhouette -->
    <path d="M 18,38 L 42,38 C 42,38 40,24 30,24 C 20,24 18,38 18,38 Z" fill="url(#goldGrad)" opacity="0.9"/>
    <path d="M 23,38 L 20,46 L 40,46 L 37,38 Z" fill="url(#goldGrad)"/>
    <line x1="17" y1="46" x2="43" y2="46" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
    
    <!-- 7th Heaven Celestial Star on Top -->
    <path d="M 30,15 L 32,20 L 37,20 L 33,23 L 35,28 L 30,25 L 25,28 L 27,23 L 23,20 L 28,20 Z" fill="#FFEBBF" filter="url(#glow)"/>
    
    <!-- The Number 7 accent -->
    <text x="30" y="35" font-family="'Playfair Display', serif" font-size="14" font-weight="900" fill="#1C100C" text-anchor="middle">7</text>
  </g>

  <!-- Typography -->
  <g transform="translate(75, 24)">
    <text x="0" y="20" font-family="'Playfair Display', 'Cinzel', Georgia, serif" font-size="26" font-weight="800" letter-spacing="1.5" fill="url(#goldGrad)">
      7<tspan font-size="16" dy="-8">th</tspan><tspan font-size="26" dy="8"> HEAVEN</tspan>
    </text>
    <text x="2" y="38" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="9.5" font-weight="600" letter-spacing="4" fill="url(#creamGrad)">
      THE CAKE SHOP • WAKAD
    </text>
  </g>
</svg>
